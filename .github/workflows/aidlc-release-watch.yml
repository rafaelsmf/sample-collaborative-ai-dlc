name: AI-DLC Release Watch

# Weekly: check awslabs/aidlc-workflows for releases newer than every supported
# profile and open one qualification issue per release. The check job reads
# upstream data with a read-only token; only the publish job, which fetches
# nothing and posts only the report it validates, can write issues. Nothing
# changes code, the release registry or a deployment: onboarding a version
# stays a reviewed pull request. Re-run the whole workflow, not one job.
on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check (vX.Y.Z). Empty checks for new releases.'
        required: false
        default: ''

permissions: {}

concurrency:
  group: aidlc-release-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'aws-samples/sample-collaborative-ai-dlc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Check upstream AI-DLC releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v2.11.5."
            exit 1
          fi
          node scripts/aidlc-release-watch/check.mjs ${RELEASE_TAG:+--tag "$RELEASE_TAG"} --out "$RUNNER_TEMP/release-watch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aidlc-release-watch
          path: ${{ runner.temp }}/release-watch/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    if: github.repository == 'aws-samples/sample-collaborative-ai-dlc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/aidlc-release-watch/publish.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aidlc-release-watch
          path: release-watch
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { publishReleaseReports } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/aidlc-release-watch/publish.mjs`
            );
            await publishReleaseReports({
              github,
              context,
              reportFile: `${process.env.GITHUB_WORKSPACE}/release-watch/aidlc-release-watch.json`,
              info: core.info,
            });
